spring:
  application:
    name: flow-orchestrator
  # Registry PostgreSQL database, orchestrator schema. The schema and tables are this repository's
  # db/ scripts (db/changelog.xml), applied by hand; the orchestrator runs no migrations.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Every connection works in the orchestrator schema, so the SQL uses unqualified names.
      schema: ${DB_SCHEMA:orchestrator}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

orchestrator:
  # The single domain this instance processes (VALIDATION or INGESTION). Required; no default.
  domain: ${ORCHESTRATOR_DOMAIN}

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/}

  # Queue and routing-key names are prefixed per instance, for example "validation" or
  # "ingestion", so both domains can share a vhost. ORCHESTRATOR_MESSAGING_PREFIX is required (an
  # empty prefix gives invalid names and stops startup).
  messaging:
    enabled: ${ORCHESTRATOR_MESSAGING_ENABLED:true}
    prefix: ${ORCHESTRATOR_MESSAGING_PREFIX:}
    dead-letter-exchange: orchestrator.dlx
    commands:
      exchange: orchestrator
      routing-key: ${orchestrator.messaging.prefix}.command
      queue: orchestrator.${orchestrator.messaging.prefix}.commands
      threads: 2
    completions:
      exchange: orchestrator
      routing-key: ${orchestrator.messaging.prefix}.step.completed
      queue: orchestrator.${orchestrator.messaging.prefix}.step.completed
      threads: 4
    # Legacy completions of the dwc-dp-analyser-service (DwcDpValidationFinished). Deploy the
    # analyser with output exchange "orchestrator" and this routing key.
    dwcdp-analysis-finished:
      exchange: orchestrator
      routing-key: ${orchestrator.messaging.prefix}.dwcdp.analysis.finished
      queue: orchestrator.${orchestrator.messaging.prefix}.dwcdp.analysis.finished
      threads: 2
    workflow-finished:
      exchange: orchestrator
      routing-key: ${orchestrator.messaging.prefix}.workflow.finished

  relay:
    poll-interval: 1s
    batch-size: 100
    confirm-timeout: 10s
    max-backoff: 5m

# Example workflow and step routing. Node keys are gbif-api StepType names; every step used in a
