spring:
  application:
    name: flow-orchestrator

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}

# Workflow DAG. Node keys are gbif-api StepType names. Example:
# orchestrator:
#   workflow:
#     parallel: false
#     default-join-policy: NON_ERROR
#     nodes:
#       VALIDATOR_VALIDATE_DWCDP: {}
#       VALIDATOR_DWCDP_STAGE:
#         dependencies: [VALIDATOR_VALIDATE_DWCDP]
#       VALIDATOR_DWCDP_TO_VERBATIM:
#         dependencies: [VALIDATOR_DWCDP_STAGE]
