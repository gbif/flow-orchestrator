# Test overrides, loaded in addition to the main application.yml.
spring:
  datasource:
    # INIT creates the schema that 001-orchestrator-schema.sql creates in PostgreSQL (that file
    # is PostgreSQL-only); the connections then use it as their current schema (hikari.schema).
    url: jdbc:h2:mem:orchestrator-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS orchestrator
    username: sa
    password: ""
  sql:
    init:
      mode: always
      # The production table script itself, not a copy.
      schema-locations: classpath:db/002-orchestrator-tables.sql

orchestrator:
  domain: VALIDATION
  workflows:
    validation-dwcdp:
      domain: VALIDATION
      match:
        fileFormat: DWCDP
      nodes:
        - step: VALIDATOR_VALIDATE_DWCDP
        - step: VALIDATOR_DWCDP_STAGE
          dependencies: [VALIDATOR_VALIDATE_DWCDP]
        - step: VALIDATOR_DWCDP_TO_VERBATIM
          dependencies: [VALIDATOR_DWCDP_STAGE]
    # The DwC-A checklist chain (shortened): the workflow selection by fileFormat and checklist,
    # and the ChecklistBank wait step, load like any other.
    validation-dwca-checklist:
      domain: VALIDATION
      match:
        fileFormat: DWCA
        checklist: "true"
      nodes:
        - step: VALIDATOR_VALIDATE_ARCHIVE
        - step: VALIDATOR_CHECKLISTBANK
          dependencies: [VALIDATOR_VALIDATE_ARCHIVE]
        - step: VALIDATOR_DWCA_TO_VERBATIM
          dependencies: [VALIDATOR_CHECKLISTBANK]
  steps:
    VALIDATOR_VALIDATE_ARCHIVE:
      request:
        exchange: occurrence
        routing-key: occurrence.pipelines.archive.validator.validator
    VALIDATOR_CHECKLISTBANK:
      request:
        exchange: orchestrator
        routing-key: validation.checklistbank
    VALIDATOR_DWCA_TO_VERBATIM:
      request:
        exchange: occurrence
        routing-key: occurrence.pipelines.balancer
    VALIDATOR_VALIDATE_DWCDP:
      request:
        exchange: occurrence
        routing-key: validator.dwcdp.analysis
    VALIDATOR_DWCDP_STAGE:
      request:
        exchange: occurrence
        routing-key: validator.dwcdp.stage
    VALIDATOR_DWCDP_TO_VERBATIM:
      request:
        exchange: occurrence
        routing-key: validator.dwcdp.toverbatim
  messaging:
    # no broker in tests; listeners and relay are tested directly
    enabled: false
    workflow-finished:
      exchange: orchestrator
      routing-key: validation.workflow.finished
  database:
    # H2 stores CAST(? AS jsonb) as a JSON string; FORMAT JSON parses it (see JsonSql)
    json-parameter: ":%s FORMAT JSON"
