apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flow-orchestrator-ws.fullname" . }}
  labels:
    {{- include "flow-orchestrator-ws.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "flow-orchestrator-ws.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flow-orchestrator-ws.labels" . | nindent 8 }}
        app.kubernetes.io/version: {{ .Values.image.tag | quote }}
        app.kubernetes.io/component: ws
      annotations:
        # Restart the pods when the configuration or the secret values change.
        checksum: {{ toYaml .Values | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.waitFor }}
      initContainers:
        {{- range $i, $target := .Values.waitFor }}
        {{- $parts := splitList ":" $target }}
        - name: wait-for-{{ $i }}
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ index $parts 0 }} {{ index $parts 1 }}; do echo "waiting for {{ $target }}"; sleep 2; done']
        {{- end }}
      {{- end }}
      containers:
        - name: flow-orchestrator-ws
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "flow-orchestrator-ws.secretName" . }}
          env:
            - name: JVM_OPTIONS
              value: {{ .Values.jvmOptions | quote }}
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/app/config/"
            - name: DB_URL
              value: {{ .Values.db.url | quote }}
            - name: DB_USERNAME
              value: {{ .Values.db.username | quote }}
            - name: DB_SCHEMA
              value: {{ .Values.db.schema | quote }}
            - name: RABBIT_HOST
              value: {{ .Values.rabbit.host | quote }}
            - name: RABBIT_PORT
              value: {{ .Values.rabbit.port | quote }}
            - name: RABBIT_VHOST
              value: {{ .Values.rabbit.vhost | quote }}
            - name: RABBIT_USERNAME
              value: {{ .Values.rabbit.username | quote }}
            - name: STORE_PATH
              value: /data/store
            - name: UPLOAD_WORKING_DIRECTORY
              value: /data/upload
            - name: LOGGING_LEVEL_ORG_GBIF_ORCHESTRATOR
              value: {{ .Values.log.level | quote }}
            {{- range $name, $value := .Values.settings }}
            {{- if not (eq (toString $value) "") }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: store
              mountPath: /data/store
            - name: upload
              mountPath: /data/upload
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flow-orchestrator-ws.fullname" . }}-config
        - name: store
          {{- if .Values.volumes.store }}
          {{- toYaml .Values.volumes.store | nindent 10 }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: upload
          {{- if .Values.volumes.upload }}
          {{- toYaml .Values.volumes.upload | nindent 10 }}
          {{- else }}
          emptyDir: {}
          {{- end }}
