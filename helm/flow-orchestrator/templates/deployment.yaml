apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flow-orchestrator.fullname" . }}
  labels:
    {{- include "flow-orchestrator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "flow-orchestrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flow-orchestrator.labels" . | nindent 8 }}
        app.kubernetes.io/version: {{ .Values.image.tag | quote }}
        app.kubernetes.io/component: engine
      {{- if .Values.yunikorn.enabled }}
        yunikorn.apache.org/app-id: {{ .Values.yunikorn.appId | required "yunikorn.appId is required when yunikorn.enabled" | quote }}
        yunikorn.apache.org/queue: {{ .Values.yunikorn.queue | required "yunikorn.queue is required when yunikorn.enabled" | quote }}
      {{- end }}
      annotations:
        # Restart the pods when the configuration or the secret values change.
        checksum: {{ toYaml .Values | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.waitFor }}
      initContainers:
        {{- range $i, $target := .Values.waitFor }}
        {{- $parts := splitList ":" $target }}
        - name: wait-for-{{ $i }}
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ index $parts 0 }} {{ index $parts 1 }}; do echo "waiting for {{ $target }}"; sleep 2; done']
        {{- end }}
      {{- end }}
      containers:
        - name: flow-orchestrator
          image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "flow-orchestrator.secretName" . }}
          env:
            - name: JVM_OPTIONS
              value: {{ .Values.jvmOptions | quote }}
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/app/config/"
            {{- if .Values.logbackConfig }}
            - name: LOGGING_CONFIG
              value: /app/config/logback.xml
            {{- end }}
            - name: DB_URL
              value: {{ .Values.db.url | quote }}
            - name: DB_USERNAME
              value: {{ .Values.db.username | quote }}
            - name: DB_SCHEMA
              value: {{ .Values.db.schema | quote }}
            - name: ORCHESTRATOR_DOMAIN
              value: {{ .Values.orchestrator.domain | required "orchestrator.domain is required" | quote }}
            - name: ORCHESTRATOR_MESSAGING_PREFIX
              value: {{ .Values.orchestrator.messagingPrefix | required "orchestrator.messagingPrefix is required" | quote }}
            - name: ORCHESTRATOR_MESSAGING_ENABLED
              value: {{ .Values.orchestrator.messagingEnabled | quote }}
            - name: RABBIT_HOST
              value: {{ .Values.rabbit.host | quote }}
            - name: RABBIT_PORT
              value: {{ .Values.rabbit.port | quote }}
            - name: RABBIT_VHOST
              value: {{ .Values.rabbit.vhost | quote }}
            - name: RABBIT_USERNAME
              value: {{ .Values.rabbit.username | quote }}
            - name: LOGGING_LEVEL_ORG_GBIF_ORCHESTRATOR
              value: {{ .Values.log.level | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "flow-orchestrator.fullname" . }}-config
