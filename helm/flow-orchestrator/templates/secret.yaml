{{- if not .Values.secrets.existingSecret }}
{{- $required := list "DB_PASSWORD" "RABBIT_PASSWORD" }}
{{- range $key := $required }}
{{- if not (hasKey $.Values.secrets.values $key) }}
  {{- fail (printf "secrets: set secrets.existingSecret, or secrets.values.%s (see values.yaml)" $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flow-orchestrator.secretName" . }}
  labels:
    {{- include "flow-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
