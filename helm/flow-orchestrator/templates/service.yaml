apiVersion: v1
kind: Service
metadata:
  name: {{ include "flow-orchestrator.fullname" . }}
  labels:
    {{- include "flow-orchestrator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "flow-orchestrator.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
