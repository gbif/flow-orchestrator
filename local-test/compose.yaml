# Local integration environment for the flow-orchestrator (validation domain).
# See USAGE.md. Run from local-test/.
name: flow-orchestrator-local

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: localtest
      POSTGRES_PASSWORD: localtest
    volumes:
      # The orchestrator schema from the repository's db/ scripts, applied as in the real
      # environments: roles, then the schema and grants, then the tables as the orchestrator role.
      - ./db/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ../db/001-orchestrator-schema.sql:/docker-entrypoint-initdb.d/10-orchestrator-schema.sql:ro
      - ./db/20-orchestrator-tables.sh:/docker-entrypoint-initdb.d/20-orchestrator-tables.sh:ro
      - ../db/002-orchestrator-tables.sql:/orchestrator-db/002-orchestrator-tables.sql:ro
      - ../db/003-validation-tables.sql:/orchestrator-db/003-validation-tables.sql:ro
      - ../db/004-validation-grants.sql:/orchestrator-db/004-validation-grants.sql:ro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "localtest", "-d", "registry"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: docker.io/library/rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: localtest
      RABBITMQ_DEFAULT_PASS: localtest
    ports:
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  orchestrator:
    image: ${ORCHESTRATOR_IMAGE:-localhost/flow-orchestrator:test}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./application-local.yml:/etc/flow-orchestrator/application-local.yml:ro
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: "file:/etc/flow-orchestrator/"
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/registry
      DB_USERNAME: orchestrator
      DB_PASSWORD: localtest
      ORCHESTRATOR_DOMAIN: VALIDATION
      ORCHESTRATOR_MESSAGING_PREFIX: validation
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: localtest
      RABBIT_PASSWORD: localtest
    ports:
      - "127.0.0.1:18080:8080"

  # The validation web service, opt in with --profile ws (task up:ws). Users are authenticated
  # remotely, so it needs a GBIF API (GBIF_API_URL, for example UAT) and an app key in .env.
  ws:
    profiles: ["ws"]
    image: ${ORCHESTRATOR_WS_IMAGE:-localhost/flow-orchestrator-ws:test}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/registry
      DB_USERNAME: orchestrator_ws
      DB_PASSWORD: localtest
      STORE_PATH: /data/store
      UPLOAD_WORKING_DIRECTORY: /data/upload
      RABBIT_HOST: rabbitmq
      RABBIT_USERNAME: localtest
      RABBIT_PASSWORD: localtest
      GBIF_API_URL: ${GBIF_API_URL:-https://api.gbif-uat.org/v1/}
      GBIF_APP_KEY: ${GBIF_APP_KEY:-}
      GBIF_APP_SECRET: ${GBIF_APP_SECRET:-}
      # Mail is best effort; without an SMTP server the ws logs that it could not send.
      MAIL_HOST: ${MAIL_HOST:-localhost}
    volumes:
      - ${VALIDATION_STORE_DIR:-./store}:/data/store
    ports:
      - "127.0.0.1:18081:8080"

  # Real DwC-DP analyser, opt in with --profile analyser (task up:analyser).
  analyser:
    profiles: ["analyser"]
    image: ${DWCDP_ANALYSER_IMAGE:-docker.gbif.org/dwc-dp-analyser-service:0.0.9-SNAPSHOT}
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: "5672"
      RABBIT_USER: localtest
      RABBIT_PASSWORD: localtest
      RABBIT_VHOST: /
      # The analyser binds its own queue; the orchestrator only knows exchange and routing key.
      INPUT_QUEUE: dwcdp-validator-validation
      INPUT_EXCHANGE: orchestrator
      INPUT_ROUTING_KEY: validation.dwcdp.analysis
      OUTPUT_EXCHANGE: orchestrator
      OUTPUT_ROUTING_KEY: validation.dwcdp.analysis.finished
      REGISTRY_URL: ""
      REGISTRY_USER: ""
      REGISTRY_PASSWORD: ""
      DUCKDB_MEMORY: ${DUCKDB_MEMORY:-2GiB}
      DUCKDB_TEMP_DIR: /data/workdir/.tmp
      JVM_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=30.0 -Xms256m -Xmx1g"
    volumes:
      - ${DATAPACKAGES_DIR:-./datapackages}:/data/datapackages:ro
      - ${DWCDP_WORKDIR:-./workdir}:/data/workdir
