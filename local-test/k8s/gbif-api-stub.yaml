# Stand-in for the two GBIF API (registry) user endpoints flow-orchestrator-ws calls, so the local
# environment talks to no GBIF environment:
#   POST /user/auth/basic        every request's Basic credentials (gbif-common-ws remote auth);
#                                200 with the LoggedUser JSON, otherwise 401
#   GET  /admin/user/{userName}  the user for emails (address, settings.locale); the app-key
#                                signature is not checked
# Users (password = user name): alice (USER, en), bob (USER, es), admin (USER, REGISTRY_ADMIN).
# Everything else, ChecklistBank included, gets WireMock's 404.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gbif-api-stub
data:
  users.json: |
    {
      "mappings": [
        {
          "priority": 1,
          "request": { "method": "POST", "urlPath": "/user/auth/basic",
                       "headers": { "Authorization": { "equalTo": "Basic YWxpY2U6YWxpY2U=" } } },
          "response": { "status": 200, "headers": { "Content-Type": "application/json" },
                        "jsonBody": { "key": 1, "userName": "alice", "firstName": "Alice", "lastName": "Local",
                                      "email": "alice@example.org", "roles": ["USER"],
                                      "settings": { "locale": "en" } } }
        },
        {
          "priority": 1,
          "request": { "method": "POST", "urlPath": "/user/auth/basic",
                       "headers": { "Authorization": { "equalTo": "Basic Ym9iOmJvYg==" } } },
          "response": { "status": 200, "headers": { "Content-Type": "application/json" },
                        "jsonBody": { "key": 2, "userName": "bob", "firstName": "Bob", "lastName": "Local",
                                      "email": "bob@example.org", "roles": ["USER"],
                                      "settings": { "locale": "es" } } }
        },
        {
          "priority": 1,
          "request": { "method": "POST", "urlPath": "/user/auth/basic",
                       "headers": { "Authorization": { "equalTo": "Basic YWRtaW46YWRtaW4=" } } },
          "response": { "status": 200, "headers": { "Content-Type": "application/json" },
                        "jsonBody": { "key": 3, "userName": "admin", "firstName": "Admin", "lastName": "Local",
                                      "email": "admin@example.org", "roles": ["USER", "REGISTRY_ADMIN"],
                                      "settings": { "locale": "en" } } }
        },
        {
          "priority": 10,
          "request": { "method": "POST", "urlPath": "/user/auth/basic" },
          "response": { "status": 401 }
        },
        {
          "request": { "method": "GET", "urlPath": "/admin/user/alice" },
          "response": { "status": 200, "headers": { "Content-Type": "application/json" },
                        "jsonBody": { "key": 1, "userName": "alice", "firstName": "Alice", "lastName": "Local",
                                      "email": "alice@example.org", "roles": ["USER"],
                                      "settings": { "locale": "en" }, "systemSettings": {} } }
        },
        {
          "request": { "method": "GET", "urlPath": "/admin/user/bob" },
          "response": { "status": 200, "headers": { "Content-Type": "application/json" },
                        "jsonBody": { "key": 2, "userName": "bob", "firstName": "Bob", "lastName": "Local",
                                      "email": "bob@example.org", "roles": ["USER"],
                                      "settings": { "locale": "es" }, "systemSettings": {} } }
        },
        {
          "request": { "method": "GET", "urlPath": "/admin/user/admin" },
          "response": { "status": 200, "headers": { "Content-Type": "application/json" },
                        "jsonBody": { "key": 3, "userName": "admin", "firstName": "Admin", "lastName": "Local",
                                      "email": "admin@example.org", "roles": ["USER", "REGISTRY_ADMIN"],
                                      "settings": { "locale": "en" }, "systemSettings": {} } }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gbif-api
  labels: { app: gbif-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: gbif-api }
  template:
    metadata:
      labels: { app: gbif-api }
    spec:
      containers:
        - name: wiremock
          image: docker.io/wiremock/wiremock:3.9.1
          args: ["--port", "8080", "--disable-banner"]
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /__admin/health, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: mappings, mountPath: /home/wiremock/mappings, readOnly: true }
      volumes:
        - name: mappings
          configMap:
            name: gbif-api-stub
---
apiVersion: v1
kind: Service
metadata:
  name: gbif-api
spec:
  selector: { app: gbif-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
