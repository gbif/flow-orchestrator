# Postgres for the local environment: the registry database with the orchestrator schema, created
# from the repository's db/ scripts on an empty data directory (emptyDir: "task down" or a pod
# restart starts from scratch). The ConfigMap orchestrator-db is built by "task up" from
# local-test/db/ and ../db/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          env:
            - { name: POSTGRES_DB, value: registry }
            - { name: POSTGRES_USER, value: localtest }
            - { name: POSTGRES_PASSWORD, value: localtest }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "localtest", "-d", "registry"]
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            # Applied in this order, as in the real environments: roles, schema and grants, then
            # the tables as the orchestrator role (20-orchestrator-tables.sh reads /orchestrator-db).
            - { name: db, mountPath: /docker-entrypoint-initdb.d/00-roles.sql, subPath: 00-roles.sql }
            - { name: db, mountPath: /docker-entrypoint-initdb.d/10-orchestrator-schema.sql, subPath: 001-orchestrator-schema.sql }
            - { name: db, mountPath: /docker-entrypoint-initdb.d/20-orchestrator-tables.sh, subPath: 20-orchestrator-tables.sh }
            - { name: db, mountPath: /orchestrator-db }
      volumes:
        - name: data
          emptyDir: {}
        - name: db
          configMap:
            name: orchestrator-db
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
